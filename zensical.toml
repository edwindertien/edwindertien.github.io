[project]
site_name = "Edwin Dertien"
site_description = "Documentation of robotics, instrument and installation projects by Edwin Dertien."
site_author = "Edwin Dertien"
site_url = "https://edwindertien.github.io/"
copyright = "&copy; Edwin Dertien"
extra_css = ["stylesheets/extra.css"]

# The menu below is rewritten by scripts/sync_projects.py (between the two marker lines),
# using the order and titles from repos.yml. Edit repos.yml, not the generated part.
nav = [
  { "Home" = "index.md" },
  # BEGIN GENERATED NAV
  { "Projects" = [
    "projects/index.md",
    { "Pico Tonewheel Organ" = ["projects/picotonewheel/index.md", { "Developer notes" = "projects/picotonewheel/context.md" }] },
    { "Tonewheel Organ Keyboard" = ["projects/picomidikeyboard/index.md", { "Developer notes" = "projects/picomidikeyboard/context.md" }] },
    { "SEN66 Environmental Monitor" = ["projects/picoLoraSEN66/index.md", { "Developer notes" = "projects/picoLoraSEN66/context.md" }] },
  ] },
  # END GENERATED NAV
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
