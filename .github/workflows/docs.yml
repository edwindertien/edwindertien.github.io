name: Build and deploy site

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * *"          # nightly: picks up README changes in the project repos
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [project-updated]       # optional: a project repo can trigger a rebuild right away

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: python scripts/sync_projects.py
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
