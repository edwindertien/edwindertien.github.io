# ══════════════════════════════════════════════════════════════════
#  RUBRIC DEFINITION — Social Robot Design (Portfolio Assessment)
#  ──────────────────────────────────────────────────────────────────
#  Total points: 100
#  EU grade: 1 + 9 × (earned / 100)
#
#  1. General aspects                10 pt  (2+2+2+2+2)
#  2. Case description               10 pt  (2+2+3+3)
#  3. Scenario design tool           10 pt  (2+3+3+2)
#  4. Expressiveness tool (session)   8 pt  (2+3+3)
#  5. Embodiment design tool         10 pt  (2+3+3+2)
#  6. Ethics / EduLARP (session)      6 pt  (1+2+3)
#  7. Behaviour design tool          10 pt  (2+3+3+2)
#  8. In-depth group assignment      26 pt  (4+6+3+6+2+5)
#  9. Poster and movie               10 pt  (5+5 checklist)
# ══════════════════════════════════════════════════════════════════

title: "Social Robot Design"
course: "SRD-2025"
grading: true
grade_decimals: 1

sections:

  # ════════════════════════════════════════════════════════════════
  # 1. GENERAL ASPECTS  ·  10 pt  (2+2+2+2+2)
  # ════════════════════════════════════════════════════════════════
  - id: general
    title: "general aspects"
    fields:

      - id: gen_structure
        label: "structure and navigation (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Clear chapter structure, table of contents, sections easy to find, pages well-chunked."

      - id: gen_structure_obs
        label: "structure observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no table of contents or overview"
          - "sections hard to find or illogically ordered"
          - "walls of text — pages not chunked"
        positive:
          - "clear chapter structure matching course topics"
          - "table of contents or overview page present"
          - "pages well-chunked and scannable"

      - id: gen_style
        label: "academic style (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Complete sentences, no informal or second-person language, course terminology used correctly."

      - id: gen_style_obs
        label: "style observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "informal or colloquial language used"
          - "second-person ('you') forms present"
          - "course terminology absent or misused"
          - "unsupported claims — assertions without reasoning"
        positive:
          - "academic register maintained throughout"
          - "course concepts named and used correctly"
          - "claims supported with reasoning or references"

      - id: gen_images
        label: "images with captions, referenced in text (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Every image has a descriptive caption and is referenced in the running text. No decorative images."

      - id: gen_images_obs
        label: "image observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "images present without caption"
          - "decorative or irrelevant images used"
          - "images not referenced in running text"
          - "images interchangeable — could illustrate any project"
        positive:
          - "every image has a descriptive caption"
          - "images referenced where discussed"
          - "images are specific to this project and add meaning"

      - id: gen_references
        label: "literature and internal cross-references (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Literature cited consistently. Sections cross-reference each other where relevant."

      - id: gen_references_obs
        label: "reference observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no or inconsistent literature references"
          - "no internal cross-references between sections"
          - "reference format inconsistent"
        positive:
          - "literature cited consistently in recognised format"
          - "case description linked from tool sections"
          - "group work references relevant course tool section"

      - id: gen_coherence
        label: "portfolio coherence and learning arc (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Later sections visibly informed by earlier ones. At least one explicit reflection on how understanding of the case changed across the course."

      - id: gen_coherence_obs
        label: "coherence observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "portfolio reads as separate assignments, not a developed document"
          - "no evidence later sections build on earlier work"
          - "no reflection on how case understanding developed"
        positive:
          - "later sections reference and build on earlier work"
          - "explicit moment of reflection on changed understanding"
          - "design decisions trace back through the portfolio"

      - id: gen_note
        label: "general notes"
        type: textarea
        placeholder: "Overall quality of the portfolio as a document…"


  # ════════════════════════════════════════════════════════════════
  # 2. CASE DESCRIPTION  ·  10 pt  (2+2+3+3)
  # ════════════════════════════════════════════════════════════════
  - id: case
    title: "case description"
    fields:

      - id: case_explanation
        label: "case explanation and target audience (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Deployment context, robot role, and user groups described specifically. Named context, not a generic one."

      - id: case_explanation_obs
        label: "case explanation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "context is generic — not a specific named situation"
          - "user groups not identified"
          - "robot's role unclear or underspecified"
          - "case appears hypothetical rather than grounded"
        positive:
          - "named, specific deployment context"
          - "direct and indirect user groups identified"
          - "robot's role clearly described"
          - "case discussed with someone in that context"

      - id: case_visual
        label: "visualisation of the case (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Case visualised: context photos/sketches, stakeholder diagrams, scenario thumbnails. Reader understands case without reading text."

      - id: case_visual_obs
        label: "visualisation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no visualisation of the case context"
          - "images present but not explained or labelled"
          - "visual gives no information a reader couldn't infer"
        positive:
          - "context photos or sketches with annotation"
          - "stakeholder diagram or user map"
          - "case understandable from visuals alone"

      - id: case_lit_core
        label: "core HRI literature — min. 5 publications (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "At least 5 HRI publications cited and connected to specific design decisions or open questions in the case — not summary annotations."

      - id: case_lit_core_obs
        label: "core literature observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "fewer than 5 HRI publications cited"
          - "publications listed but not connected to the case"
          - "references used as decoration, not argument"
        positive:
          - "5 or more directly relevant HRI publications"
          - "each publication connected to a specific design decision"
          - "references used to justify or problematise case choices"

      - id: case_lit_adjacent
        label: "adjacent field literature — min. 5 publications (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "At least 5 publications from adjacent fields (service design, medical communication, human factors, etc.) discussed and connected to the case."

      - id: case_lit_adjacent_obs
        label: "adjacent literature observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "fewer than 5 adjacent field publications"
          - "adjacent publications not discussed — just listed"
          - "publications do not expand the design space"
        positive:
          - "5 or more adjacent field publications"
          - "each connected to the case and discussed"
          - "adjacent literature genuinely expands the framing"

      - id: case_note
        label: "case description notes"
        type: textarea
        placeholder: "Observations on the quality and grounding of the case description…"


  # ════════════════════════════════════════════════════════════════
  # 3. SCENARIO DESIGN TOOL  ·  10 pt  (2+3+3+2)
  # ════════════════════════════════════════════════════════════════
  - id: scenario
    title: "scenario design tool"
    fields:

      - id: sc_visual
        label: "visualisation (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Visualise tool structure, tool-in-action, and output. Captions label each stage: conceptualisation, realisation, in-action, result."

      - id: sc_visual_obs
        label: "visualisation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "tool structure not visualised"
          - "no image of tool in use"
          - "output not shown"
          - "images present but not labelled by stage"
        positive:
          - "tool structure shown (cards, canvas, protocol diagram)"
          - "at least one image of tool in action"
          - "output of the tool shown and captioned"
          - "stages labelled: conceptualisation → realisation → in-action → result"

      - id: sc_tool
        label: "tool design — HRI knowledge embedded (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Grounded in a course framework (scenario-based design, narrative templates, boundary conditions). HRI-specific knowledge made explicit."

      - id: sc_tool_obs
        label: "tool design observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no theoretical framework identified"
          - "HRI knowledge not embedded — could be a generic tool"
          - "framework named but not operationalised in the tool"
        positive:
          - "specific HRI framework named and applied"
          - "tool embeds HRI knowledge explicitly"
          - "explains what HRI-specific capability the tool provides"

      - id: sc_application
        label: "application to case (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Session documented: experiment described, observations made, output produced. Design decision informed or changed as a result."

      - id: sc_application_obs
        label: "application observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "session not documented or only described vaguely"
          - "no output from the tool shown"
          - "no design decision connected to the tool use"
        positive:
          - "session described with sufficient detail"
          - "output quoted or reproduced"
          - "specific design decision informed by tool use"

      - id: sc_eval
        label: "evaluation and reflection (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Evaluates outcome quality AND tool quality. Reflection connected to at least one publication."

      - id: sc_eval_obs
        label: "evaluation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "only outcome evaluated — tool quality not addressed"
          - "no publication connected to reflection"
          - "evaluation is superficial or only positive"
        positive:
          - "outcome quality evaluated explicitly"
          - "tool quality evaluated explicitly (specificity, usability, generalisability)"
          - "reflection connected to at least one publication"

      - id: sc_note
        label: "scenario tool notes"
        type: textarea
        placeholder: "Observations on the scenario design tool section…"


  # ════════════════════════════════════════════════════════════════
  # 4. EXPRESSIVENESS DESIGN TOOL (IN-SESSION)  ·  8 pt  (2+3+3)
  # ════════════════════════════════════════════════════════════════
  - id: expression
    title: "expressiveness design tool (in-session)"
    fields:

      - id: ex_visual
        label: "visualisation (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Annotated motion sketches, Laban notation, photos of expressive positions, or video stills with annotation. Detailed enough for someone not in the session."

      - id: ex_visual_obs
        label: "visualisation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no visual record of the session"
          - "images present but not annotated"
          - "visuals too sparse to understand what happened"
        positive:
          - "annotated motion sketches or Laban notation present"
          - "photos or stills from the session with captions"
          - "visual record sufficient for someone not in the session"

      - id: ex_observation
        label: "structured observation (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Session described with a structured framework. What did the tool make visible? Where did the vocabulary reach its limits for your case?"

      - id: ex_observation_obs
        label: "observation quality observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no structured framework used"
          - "description only covers what happened — not what was revealed"
          - "limits of the tool not identified"
        positive:
          - "explicit framework applied to structure observations"
          - "articulates what the tool made visible"
          - "identifies where the tool's vocabulary reached its limits"

      - id: ex_reflection
        label: "reflection — applicability and HRI grounding (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Which aspects apply to your case? What would need to change? Connected to at least one publication on expressive HRI or Laban analysis."

      - id: ex_reflection_obs
        label: "reflection observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no critical assessment of applicability"
          - "reflection is generic — could apply to any case"
          - "no publication connected to reflection"
        positive:
          - "specific aspects identified as applicable to the case"
          - "specific aspects identified as not applicable, with reasoning"
          - "reflection connected to at least one relevant publication"

      - id: ex_note
        label: "expressiveness tool notes"
        type: textarea
        placeholder: "Observations on the expressiveness session section…"


  # ════════════════════════════════════════════════════════════════
  # 5. EMBODIMENT DESIGN TOOL  ·  10 pt  (2+3+3+2)
  # ════════════════════════════════════════════════════════════════
  - id: embodiment
    title: "embodiment design tool"
    fields:

      - id: em_visual
        label: "visualisation (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Visualise tool structure, embodiment options compared, moment of use, and design outcome. Label by stage."

      - id: em_visual_obs
        label: "visualisation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "tool structure not visualised"
          - "embodiment options not shown"
          - "no image of tool in use"
          - "stages not labelled"
        positive:
          - "tool structure or materials shown"
          - "embodiment options generated or compared are visible"
          - "at least one image of tool in action"
          - "stages labelled: conceptualisation → realisation → in-action → result"

      - id: em_tool
        label: "tool design — HRI knowledge embedded (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "HRI knowledge (proxemics, Uncanny Valley, form/function mapping) explicitly operationalised in the tool structure — not just mentioned."

      - id: em_tool_obs
        label: "tool design observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "HRI concepts mentioned but not embedded in tool"
          - "tool could be a generic design tool"
          - "no explanation of what the tool enables beyond generic methods"
        positive:
          - "specific HRI concept operationalised in tool structure"
          - "explains how the tool forces or guides an HRI-aware decision"
          - "tool goes beyond what a generic embodiment method would provide"

      - id: em_application
        label: "application to case (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Session documented: inputs, options generated, observations, embodiment direction reached. Case description updated as a result."

      - id: em_application_obs
        label: "application observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "session not documented"
          - "no embodiment direction reached"
          - "case description not updated"
        positive:
          - "session inputs and process documented"
          - "specific embodiment direction reached and justified"
          - "case description updated based on tool output"

      - id: em_eval
        label: "evaluation and reflection (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Outcome and tool quality evaluated. Connected to at least one publication on robot embodiment or proxemics."

      - id: em_eval_obs
        label: "evaluation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "evaluation absent or only positive"
          - "outcome and tool quality not distinguished"
          - "no publication connected"
        positive:
          - "outcome quality evaluated"
          - "tool quality evaluated (specificity, usability, generalisability)"
          - "connected to at least one relevant publication"

      - id: em_note
        label: "embodiment tool notes"
        type: textarea
        placeholder: "Observations on the embodiment design tool section…"


  # ════════════════════════════════════════════════════════════════
  # 6. ETHICS / EDULARP (IN-SESSION)  ·  6 pt  (1+2+3)
  # ════════════════════════════════════════════════════════════════
  - id: ethics
    title: "ethics / EduLARP (in-session)"
    fields:

      - id: et_visual
        label: "visualisation (1 pt)"
        type: slider
        min: 0
        max: 1
        step: 1
        points: 1
        description: "At least one image with caption explaining the ethical situation explored in the session."

      - id: et_visual_obs
        label: "visualisation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no visual documentation of the session"
          - "image present but not captioned or explained"
        positive:
          - "at least one image with caption explaining the ethical situation"

      - id: et_observation
        label: "structured observation (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Ethical tensions made visible described specifically. What did the roleplay format reveal that desk-based analysis would not?"

      - id: et_observation_obs
        label: "observation quality observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "description only covers what happened — not what was revealed"
          - "observations generic — could apply to any ethics exercise"
          - "does not address what roleplay reveals beyond desk analysis"
        positive:
          - "specific ethical tensions identified and described"
          - "stakeholder perspectives described concretely"
          - "articulates what roleplay format made visible"

      - id: et_reflection
        label: "reflection — applicability and HRI grounding (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Which issues are relevant to your case? What would an adapted tool look like? Connected to at least one publication on robot ethics or value-sensitive design."

      - id: et_reflection_obs
        label: "reflection observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no connection to own design case"
          - "no proposal for adaptation"
          - "no publication connected"
        positive:
          - "specific ethical issues connected to design case"
          - "concrete proposal for how tool could be adapted"
          - "connected to at least one relevant publication"

      - id: et_note
        label: "ethics / EduLARP notes"
        type: textarea
        placeholder: "Observations on the ethics session section…"


  # ════════════════════════════════════════════════════════════════
  # 7. BEHAVIOUR DESIGN TOOL  ·  10 pt  (2+3+3+2)
  # ════════════════════════════════════════════════════════════════
  - id: behaviour
    title: "behaviour design tool"
    fields:

      - id: bh_visual
        label: "visualisation (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Visualise tool structure, architecture/behaviour model produced, and at least one observation from testing. Label by stage."

      - id: bh_visual_obs
        label: "visualisation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "tool structure not visualised"
          - "no architecture or behaviour model shown"
          - "no evidence from testing shown"
          - "stages not labelled"
        positive:
          - "tool structure shown (diagrams, cards, protocol)"
          - "architecture or behaviour model for the case shown"
          - "at least one observation from testing documented visually"
          - "stages labelled: conceptualisation → realisation → in-action → result"

      - id: bh_tool
        label: "tool design — HRI knowledge embedded (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "At least one HRI concept operationalised (reactive/deliberative, autonomy allocation, graceful degradation, social signal interpretation)."

      - id: bh_tool_obs
        label: "tool design observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "HRI concepts not embedded — generic software tool"
          - "concept mentioned but not operationalised in tool structure"
          - "no explanation of what HRI-specific capability the tool provides"
        positive:
          - "specific HRI concept operationalised in tool"
          - "explains what the tool enables beyond generic software design"
          - "tool structure reflects HRI-specific knowledge"

      - id: bh_application
        label: "application to case (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Session documented: tool output, test method (WoZ/simulation/prototype), observations. What did testing reveal that design time did not anticipate?"

      - id: bh_application_obs
        label: "application observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "session not documented"
          - "test method not described"
          - "no unexpected findings from testing"
        positive:
          - "tool output documented"
          - "test method described (WoZ, simulation, or prototype)"
          - "testing revealed something not anticipated at design time"

      - id: bh_eval
        label: "evaluation and reflection (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Outcome and tool quality evaluated. Relationship to group assignment direction addressed. Connected to at least one publication."

      - id: bh_eval_obs
        label: "evaluation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "evaluation absent or only positive"
          - "relationship to group assignment not addressed"
          - "no publication connected"
        positive:
          - "outcome and tool quality both evaluated"
          - "relationship to group assignment direction addressed"
          - "connected to at least one relevant publication"

      - id: bh_note
        label: "behaviour tool notes"
        type: textarea
        placeholder: "Observations on the behaviour design tool section…"


  # ════════════════════════════════════════════════════════════════
  # 8. IN-DEPTH GROUP ASSIGNMENT  ·  26 pt  (4+6+3+6+2+5)
  # ════════════════════════════════════════════════════════════════
  - id: group
    title: "in-depth group assignment"
    fields:

      - id: gr_direction
        label: "motivated direction choice (4 pt)"
        type: slider
        min: 0
        max: 4
        step: 1
        points: 4
        description: "Direction chosen and motivated in relation to the case. Extension of course tool explained, or gap filled by different direction identified."

      - id: gr_direction_obs
        label: "direction choice observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "direction not explicitly stated"
          - "motivation not connected to the case"
          - "no explanation of what is extended or what gap is filled"
        positive:
          - "direction stated clearly (behaviour / expression / embodiment / scenario / ethics)"
          - "motivation connected to specific case need"
          - "extension or gap identified and justified"

      - id: gr_direction_note
        label: "direction choice note"
        type: text
        placeholder: "Which direction chosen and how well motivated…"

      - id: gr_visual
        label: "visualisation — conceptualisation and physicalisation (6 pt)"
        type: slider
        min: 0
        max: 6
        step: 1
        points: 6
        description: "Conceptualisation: sketches, diagrams, architecture drawings showing design iterations. Physicalisation: photos/stills of building/programming in intermediate states."

      - id: gr_visual_obs
        label: "visualisation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "conceptualisation visuals absent"
          - "only final version shown — no intermediate states"
          - "physicalisation not documented"
          - "images present but not annotated or staged"
        positive:
          - "conceptualisation sketches or diagrams show iteration"
          - "multiple intermediate states visible"
          - "physicalisation documented with photos or stills"
          - "annotations explain what is shown at each stage"

      - id: gr_testplan
        label: "test plan and method (3 pt)"
        type: slider
        min: 0
        max: 3
        step: 1
        points: 3
        description: "Who tested, what setting, what protocol, what was observed or measured. Actual hardware or realistic proxy. Changes to plan documented."

      - id: gr_testplan_obs
        label: "test plan observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no test plan described"
          - "test did not involve actual hardware or realistic proxy"
          - "changes from planned to executed not documented"
        positive:
          - "test plan described: who, setting, protocol, observation target"
          - "actual hardware or realistic proxy used"
          - "deviations from plan documented with reasoning"

      - id: gr_observations
        label: "observations — tool in action (6 pt)"
        type: slider
        min: 0
        max: 6
        step: 1
        points: 6
        description: "Structured observations, unexpected findings, failure and success moments. Evidence the test happened: photos, logs, or observer notes."

      - id: gr_observations_obs
        label: "observations quality"
        type: checklist
        points_per_positive: 0
        negative:
          - "no evidence test actually happened"
          - "observations vague or only positive"
          - "unexpected findings not documented"
          - "failures or problems not acknowledged"
        positive:
          - "structured observations documented"
          - "unexpected findings included"
          - "at least one failure or problem acknowledged"
          - "evidence of test: photos, logs, or observer notes"
          - "direct quotes or measurements where available"

      - id: gr_redesign
        label: "resulting redesign (2 pt)"
        type: slider
        min: 0
        max: 2
        step: 1
        points: 2
        description: "Iteration visible: testing led to a change in the tool or an explicit design decision. Before/after traceable."

      - id: gr_redesign_obs
        label: "redesign observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "no iteration visible after testing"
          - "testing findings not connected to any change"
        positive:
          - "specific change in tool or design traced to testing"
          - "before/after visible in the portfolio"

      - id: gr_eval
        label: "evaluation and reflection (5 pt)"
        type: slider
        min: 0
        max: 5
        step: 1
        points: 5
        description: "Design outcome evaluated AND tool quality evaluated (specificity, usability, generalisability). Grounded in at least 2 publications."

      - id: gr_eval_obs
        label: "evaluation observations"
        type: checklist
        points_per_positive: 0
        negative:
          - "only one axis evaluated (outcome or tool — not both)"
          - "evaluation is only positive"
          - "fewer than 2 publications connected"
          - "tool generalisability not addressed"
        positive:
          - "design outcome evaluated explicitly"
          - "tool quality evaluated: specificity, usability, generalisability"
          - "honest assessment — limitations named"
          - "at least 2 publications connected to reflection"

      - id: gr_overall_note
        label: "overall group assignment notes"
        type: textarea
        placeholder: "Overall quality and coherence of the group assignment section…"


  # ════════════════════════════════════════════════════════════════
  # 9. POSTER AND MOVIE  ·  10 pt  (5+5 binary checklist)
  # ════════════════════════════════════════════════════════════════
  - id: poster_movie
    title: "poster and movie"
    fields:

      - id: pm_intro
        label: "Note — binary checklist"
        type: textarea
        placeholder: "Each criterion is met (1 pt) or not met (0 pt). Add any overall notes here."

      # ── Poster ───────────────────────────────────────────────
      - id: p1
        label: "P1 — case and tool identifiable in under 10 seconds (1 pt)"
        type: radio
        description: "A reader who has never seen the project can determine the robot, context, and tool without reading body text."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: p2
        label: "P2 — tool structure is visualised (1 pt)"
        type: radio
        description: "Tool logic, protocol, or components appear as diagram, canvas, or annotated image — not described in prose."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: p3
        label: "P3 — evidence of application is shown (1 pt)"
        type: radio
        description: "At least one image or diagram showing the tool in use with the robot or in the deployment context."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: p4
        label: "P4 — result stated explicitly (1 pt)"
        type: radio
        description: "Design outcome visible as a clearly labelled element — not buried in text."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: p5
        label: "P5 — poster production quality (1 pt)"
        type: radio
        description: "Layout clean and readable; font sizes legible at poster distance; visual hierarchy guides eye from problem to tool to result."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: p_note
        label: "poster notes"
        type: text
        placeholder: "Specific observations on the poster…"

      # ── Movie ────────────────────────────────────────────────
      - id: m1
        label: "M1 — challenge framed in first 30 seconds (1 pt)"
        type: radio
        description: "Viewer knows the design problem and why it matters before any tool description begins."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: m2
        label: "M2 — tool demonstrated, not just described (1 pt)"
        type: radio
        description: "Movie shows tool in use with actual hardware or deployment context — not a slide deck about the tool."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: m3
        label: "M3 — at least one failure or unexpected finding included (1 pt)"
        type: radio
        description: "Movie acknowledges something that did not work as expected and what the team did with that."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: m4
        label: "M4 — evaluation addresses design outcome and tool quality (1 pt)"
        type: radio
        description: "Two distinct verdicts given: did the robot design improve, and does the tool work as a tool?"
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: m5
        label: "M5 — movie production quality (1 pt)"
        type: radio
        description: "Audio clear and intelligible throughout; visual material stable and well-framed; 5-minute format respected."
        points:
          - label: "not met"
            value: 0
          - label: "met"
            value: 1

      - id: m_note
        label: "movie notes"
        type: text
        placeholder: "Specific observations on the movie…"
